{% if show_location %}
    <div id="location_container" class="flex flex-col">
        <div class="flex justify-between items-center mb-1">
            <label for="id_location" class="text-xs font-semibold text-color-600 flex-1 min-w-0">
                {% trans "Location" %}
            </label>
        </div>
        <div class="relative">
            <input
                type="text"
                id="id_location"
                name="location"
                value="{{ location_value }}"
                placeholder="{% trans 'Enter Meeting Location' %}"
                class="text-color-600 p-2 placeholder:text-xs pe-[40px] w-full border border-dark-50 rounded-md mt-1 focus-visible:outline-0 placeholder:text-dark-100 text-sm [transition:.3s] focus:border-primary-600"
            >
        </div>
    </div>
{% else %}
    <div id="location_container" style="display: none">
        <input type="hidden" name="location" value="{{ location_value }}">
    </div>
{% endif %}
{% if show_meeting_provider %}
    <div id="meeting_provider_container" class="flex flex-col" hx-swap-oob="outerHTML">
        <div class="flex justify-between items-center mb-1">
            <label for="id_meeting_provider" class="text-xs font-semibold text-color-600 flex-1 min-w-0">
                {% trans "Meeting Provider" %} <span class="text-red-500">*</span>
            </label>
        </div>
        <div class="relative">
            <select
                id="id_meeting_provider"
                name="meeting_provider"
                class="text-color-600 p-2 placeholder:text-xs pe-[40px] w-full border border-dark-50 rounded-md mt-1 focus-visible:outline-0 placeholder:text-dark-100 text-sm [transition:.3s] focus:border-primary-600"
            >
                <option value="">---------</option>
                {% for value, label in meeting_provider_choices %}
                    <option value="{{ value }}" {% if value == meeting_provider_value %}selected{% endif %}>
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
        </div>
    </div>
{% else %}
    <div id="meeting_provider_container" style="display: none" hx-swap-oob="outerHTML">
        <input type="hidden" name="meeting_provider" value="{{ meeting_provider_value }}">
    </div>
{% endif %}
