<form
    hx-post="{% url 'calls:user_settings' %}"
    hx-target="#calls-user-settings-view"
    hx-select="#calls-user-settings-view"
    hx-swap="outerHTML"
>
    {% csrf_token %}
    <input type="hidden" name="provider_id" value="{{ card.provider.pk }}">
    <input type="hidden" name="action" value="save">

    <div class="mb-4">
        <label class="text-xs font-semibold text-color-600">
            {% trans "Caller ID" %}
            <span class="text-gray-400 font-normal">{% trans "(optional)" %}</span>
        </label>
        <input
            type="text"
            name="agent_id"
            value="{{ card.agent_id }}"
            placeholder="{% trans 'Your phone number (e.g. +919XXXXXXXXX)' %}"
            class="w-full border border-dark-50 rounded-md px-3 py-1.5 text-sm mt-1 focus:outline-none focus:border-primary-500"
        >
        <p class="text-xs text-gray-400 mt-1.5">
            {% trans "Leave blank to use the provider's default number set by your administrator." %}
        </p>
    </div>

    <div class="flex justify-end">
        {% btn type="submit" %}
    </div>
</form>
