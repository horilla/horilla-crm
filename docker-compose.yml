services:
  web:
    build: .
    # Localhost only. Set HORILLA_BIND=0.0.0.0 to publish the app server on
    # every interface. The production profile's public entry is nginx on port 80.
    ports:
      - "${HORILLA_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - .:/app
      - secret_key:/app/.secrets
      - staticfiles:/app/staticfiles
      - media:/app/media
    environment:
      # Off unless the host sets DEBUG=1. The production profile uses this
      # same service, so the shipped value must not turn debug on.
      - DEBUG=${DEBUG:-0}
      # Unique per install. A shipped placeholder is ignored and this file,
      # shared with the Celery services, is used instead.
      - SECRET_KEY_FILE=/app/.secrets/secret_key
      # nginx is pinned to this address below. Only that peer may set the client IP.
      - TRUSTED_PROXIES=172.30.10.10
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost,http://127.0.0.1
      - DATABASE_URL=postgres://horilla_user:horilla_pass@db:5432/horilla_db
      - DB_INIT_PASSWORD=dev-init-password-change-in-production
      - REDIS_URL=redis://:horilla_pass@redis:6379/0
      - CELERY_BROKER_URL=redis://:horilla_pass@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:horilla_pass@redis:6379/0
    networks:
      - horilla
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 30s
      # The entrypoint applies the full migration set before uvicorn binds,
      # which takes several minutes against an empty database. Failures inside
      # start_period do not count, so this has to cover a first boot -- at 60s
      # the container was reported unhealthy while it was still migrating
      # normally, and anything depending on it would never start.
      start_period: 300s
      retries: 3

  celery-worker:
    build: .
    entrypoint: []
    command: celery -A horilla worker --loglevel=info --concurrency=2
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - secret_key:/app/.secrets
      - media:/app/media
    environment:
      - SECRET_KEY_FILE=/app/.secrets/secret_key
      - DATABASE_URL=postgres://horilla_user:horilla_pass@db:5432/horilla_db
      - REDIS_URL=redis://:horilla_pass@redis:6379/0
      - CELERY_BROKER_URL=redis://:horilla_pass@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:horilla_pass@redis:6379/0
    networks:
      - horilla
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # This service sets `entrypoint: []`, so it never runs migrations itself.
      # Postgres reports healthy within seconds, but `web` applies the full
      # migration set before it binds. Waiting on db alone started the worker
      # against a database that had no tables yet, so every beat tick failed
      # with `relation "mail_horillamail" does not exist` (issue #41).
      # `web` only becomes healthy after its entrypoint has finished migrating.
      web:
        condition: service_healthy

  celery-beat:
    build: .
    entrypoint: []
    command: celery -A horilla beat --loglevel=info
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - secret_key:/app/.secrets
    environment:
      - SECRET_KEY_FILE=/app/.secrets/secret_key
      - DATABASE_URL=postgres://horilla_user:horilla_pass@db:5432/horilla_db
      - REDIS_URL=redis://:horilla_pass@redis:6379/0
      - CELERY_BROKER_URL=redis://:horilla_pass@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:horilla_pass@redis:6379/0
    networks:
      - horilla
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Same reasoning as celery-worker: beat must not start scheduling tasks
      # until `web` has finished migrating. The mail schedule fires every 10
      # seconds, so an early start floods the worker with failing tasks.
      web:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horilla_db
      POSTGRES_USER: horilla_user
      POSTGRES_PASSWORD: horilla_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - horilla
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horilla_user -d horilla_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass horilla_pass
    volumes:
      - redis_data:/data
    networks:
      - horilla
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "horilla_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - staticfiles:/static:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      horilla:
        # Django trusts forwarded client addresses only from this peer.
        ipv4_address: 172.30.10.10
    depends_on:
      web:
        condition: service_healthy
    profiles: ["production"]

networks:
  horilla:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  secret_key:
  staticfiles:
  media:
  postgres_data:
  redis_data:
