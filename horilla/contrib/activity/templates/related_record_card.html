{% load i18n %}
<div
    id="activity-related-record"
    class="flex items-center gap-2 min-w-0 px-3 py-2 rounded-md bg-gray-50 border border-dark-50 text-sm"
>
    <span class="text-xs text-color-600">{% trans "Related To" %}:</span>
    <span class="px-2 py-0.5 rounded bg-primary-200 text-primary-600 text-xs font-medium">{{ related_record.type_label }}</span>
    {% if related_record.detail_url %}
        <a
            href="{{ related_record.detail_url }}"
            hx-get="{{ related_record.detail_url }}"
            hx-target="#mainContent"
            hx-select-oob="#sideMenuContainer"
            hx-swap="outerHTML"
            hx-push-url="true"
            hx-select="#mainContent"
            class="font-semibold text-primary-600 hover:text-primary-800 hover:underline truncate"
        >{{ related_record.name }}</a>
    {% else %}
        <span class="font-semibold truncate">{{ related_record.name }}</span>
    {% endif %}
</div>
