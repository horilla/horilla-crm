<div
    id="do_this_value_container"
    class="{% if show_field %}flex flex-col{% else %}hidden{% endif %}"
    {% if not show_field %}
        style="display: none"
    {% endif %}
>
    {% if show_field %}
        <div class="flex justify-between mb-1 w-full">
            <label for="{{ form.do_this_value.id_for_label }}" class="text-xs font-semibold text-color-600">
                {{ form.do_this_value.label }}
                {% if form.do_this_value.field.required %}<span class="text-red-500">*</span>{% endif %}
            </label>
            {% if form.do_this_value.help_text %}
                <span
                    class="ms-1 inline-flex cursor-pointer text-[#a19e9e] flex-shrink-0"
                    title="{{ form.do_this_value.help_text|striptags }}"
                    aria-label="{{ form.do_this_value.help_text|striptags }}"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="15"
                        height="15"
                        viewBox="0 0 20 20"
                    >
                        <path
                            fill="currentColor"
                            d="M2.93 17.07A10 10 0 1 1 17.07 2.93A10 10 0 0 1 2.93 17.07m12.73-1.41A8 8 0 1 0 4.34 4.34a8 8 0 0 0 11.32 11.32M9 11V9h2v6H9zm0-6h2v2H9z"
                        />
                    </svg>
                </span>
            {% endif %}
        </div>
        <div class="relative">
            {{ form.do_this_value }}
        </div>
    {% endif %}
</div>
