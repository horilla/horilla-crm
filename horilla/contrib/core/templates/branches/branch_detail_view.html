{% extends "settings/settings.html" %}
{% block settings %}
    {% has_perm "core.view_company" as can_view_company %}
    {% if can_view_company %}
        <div id="branches-view" class="h-full flex flex-col" data-viewport-fit>
            {% reload_button "#branches-view" hx_select_oob="#dropdown-companies" %}
            <div
                id="navBar"
                class="flex-shrink-0"
                hx-get="{% url 'core:branch_detail_nav' obj.pk %}"
                hx-trigger="load"
            >
            </div>
            <div
                id="branch-detail-content"
                class="pt-1 flex-1 min-h-0"
                hx-get="{% url 'core:branch_details_content' obj.pk %}"
                hx-trigger="load"
                hx-swap="outerHTML"
            >
            </div>
        </div>
    {% else %}
        {% include "403.html" with embed=True %}
    {% endif %}
{% endblock %}
