            <div id="start_date_day_container" class="{% if 'start_date_day' in full_width_fields %}col-span-2{% else %}col-span-1{% endif %} flex flex-col">
                <label for="{{ form.start_date_day.id_for_label }}" class="text-xs text-gray-600 mb-1 font-medium">
                    {{ form.start_date_day.label }}
                    {% if form.start_date_day.field.required %}
                        <span class="text-red-500">*</span>
                    {% endif %}
                </label>
                <input
                    type="number"
                    name="start_date_day"
                    id="{{ form.start_date_day.id_for_label }}"
                    value="{% if start_date_day_value %}{{ start_date_day_value }}{% else %}{{ form.start_date_day.value|default_if_none:'' }}{% endif %}"
                    class="text-color-600 p-2 placeholder:text-xs w-full border border-dark-50 rounded-md mt-1 focus-visible:outline-0 placeholder:text-dark-100 text-sm [transition:.3s] focus:border-primary-600"
                    placeholder="{% blocktrans with field=form.start_date_day.label %}Enter {{ field }}{% endblocktrans %}"
                    {% if form.start_date_day.field.required %}
                        required
                    {% endif %}
                    hx-get="{% url 'core:calculate_week_start_day' %}"
                    hx-target="#week_start_day_container"
                    hx-swap="outerHTML"
                    hx-include="[name='start_date_month'],[name='start_date_day']"
                    hx-trigger="change"
                >
                {% if form.start_date_day.errors %}
                    <div class="bg-red-50 text-red-500 px-3 py-2 rounded text-xs mt-1">
                        {% for error in form.start_date_day.errors %}
                            {{ error }}
                        {% endfor %}
                    </div>
                {% endif %}
            </div>
