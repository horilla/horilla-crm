{% extends "settings/my_settings.html" %}
{% block my_settings %}
    <div id="my-profile-view" class="h-full flex flex-col" data-viewport-fit>
        {% include "messages.html" %}
        {% reload_button "#my-profile-view" %}
        <div
            id="navBar"
            class="flex-shrink-0"
            hx-get="{% url 'core:my_profile_nav' request.user.pk %}"
            hx-trigger="load"
        >
        </div>
        <div
            id="my-profile-content"
            class="pt-1 flex-1 min-h-0"
            hx-get="{% url 'core:my_profile_content' request.user.pk %}"
            hx-trigger="load"
            hx-swap="outerHTML"
        >
        </div>
    </div>
{% endblock %}
