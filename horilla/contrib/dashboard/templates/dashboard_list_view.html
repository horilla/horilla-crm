{% extends "base.html" %}
{% block messages %}{% endblock %}

{% block navbar %}
    <div
        id="navBar"
        hx-get="{% url 'dashboard:dashboard_nav_view' %}?{{ request.GET.urlencode}}&title={{title}}&pk={{pk}}"
        hx-trigger="load"
    >
    </div>
{% endblock navbar %}

{% block main %}
    <div class="p-5 pt-24 h-full flex flex-col min-h-0">
        <div class="grid grid-cols-12 gap-4 flex-1 min-h-0">
            <div class="col-span-9 xl:col-span-10 flex flex-col min-h-0">
                <div id="mainSession" class="flex-1 min-h-0 flex flex-col">{% include "list_view.html" %}</div>
            </div>
            {% include "partials/dashboard_sidebar.html" with active="all_dashboards" %}
        </div>
    </div>
{% endblock main %}
