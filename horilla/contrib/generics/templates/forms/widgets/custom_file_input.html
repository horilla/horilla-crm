{% load i18n static %}
<div
    data-file-upload
    data-input-id="{{ widget.attrs.id }}"
    data-checkbox-id="{{ widget.checkbox_id }}"
    data-file-selected-text="{% trans 'File selected' %}"
    data-upload-prompt-text="{% trans 'Click to upload or drag & drop' %}"
    data-upload-hint-text="{% trans 'Any file (Max 10MB)' %}"
>
    <!-- Main label associated with the input -->
    <label for="{{ widget.attrs.id }}" class="text-xs font-semibold text-color-600 mb-1 block">
        {% trans "Upload File" %}
    </label>

    <div class="relative">
        <div
            id="dropZone_{{ widget.attrs.id }}"
            class="bg-white flex flex-col items-center justify-center w-full h-[6rem] border-2 border-dashed border-[#d5d5d5] rounded-lg cursor-pointer hover:border-gray-400 transition relative"
            onclick="document.getElementById('{{ widget.attrs.id }}').click()"
        >
            <div
                id="uploadBoxContent_{{ widget.attrs.id }}"
                class="flex flex-col items-center justify-center text-center px-2 pointer-events-none"
            >
                {% if selected_filename %}
                    <i class="fa-solid fa-file text-xl mb-2 text-green-500"></i>
                    <p class="text-sm font-semibold text-gray-700 truncate max-w-full">{{ selected_filename }}</p>
                    <p class="text-xs text-[#9e9e9e]">{% trans "File already uploaded" %}</p>
                {% else %}
                    <i class="fa-solid fa-arrow-up-from-bracket text-xl mb-2 text-gray-500"></i>
                    <p class="text-sm font-semibold text-gray-700">{% trans "Click to upload or drag & drop" %}</p>
                    <p class="text-xs text-[#9e9e9e]">{% trans "Any file (Max 10MB)" %}</p>
                {% endif %}
            </div>

            <input
                type="{{ widget.type }}"
                name="{{ widget.name }}"
                id="{{ widget.attrs.id }}"
                class="hidden file-upload-input"
                data-upload-box="uploadBoxContent_{{ widget.attrs.id }}"
                aria-label="{% trans 'Upload File' %}"
                {% if widget.required and not selected_filename %}
                    required
                {% endif %}
                {% include "django/forms/widgets/attrs.html" %}
            >
        </div>

        <!-- Clear button -->
        <button
            type="button"
            id="clearButton_{{ widget.attrs.id }}"
            class="file-input-clear-btn text-xs text-red-600 hover:text-red-800 hover:underline {% if not selected_filename %}hidden{% endif %}"
            aria-label="{% trans 'Clear file' %}"
        >
            {% trans "Clear" %}
        </button>
    </div>

    <!-- Hidden checkbox for clearing existing files (controlled by clear button) -->
    {% if selected_filename %}
        <input
            type="checkbox"
            name="{{ widget.checkbox_name }}"
            id="{{ widget.checkbox_id }}"
            class="hidden"
            aria-hidden="true"
        >
    {% endif %}
</div>

<script src="{% static 'generics/assets/js/custom_file_input.js' %}"></script>
