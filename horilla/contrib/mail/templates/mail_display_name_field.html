<div
    id="display_name_container"
    class="{% if field.field.required %}flex flex-col{% else %}hidden{% endif %}"
>
    <div class="flex justify-between items-center mb-1">
        <label for="{{ field.id_for_label }}" class="text-xs font-semibold text-color-600 flex-1 min-w-0">
            {{ field.label }}
            {% if field.field.required %}<span class="text-red-500">*</span>{% endif %}
        </label>
    </div>
    <div class="relative">
        {{ field }}
    </div>
</div>
