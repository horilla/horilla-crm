{% extends "base.html" %}
{% block messages %}{% endblock %}

{% block navbar %}
    <div
        hx-get="{% url 'reports:reports_nav_view' %}?{{ request.GET.urlencode}}&title={{title}}"
        hx-trigger="load"
    >
    </div>
{% endblock navbar %}

{% block main %}
    {% breadcrumb_nav breadcrumbs %}

    <div class="ps-5 pe-5 flex-1 min-h-0 flex flex-col">
        <div class="grid grid-cols-12 gap-4 flex-1 min-h-0">
            <div class="col-span-9 xl:col-span-10 flex flex-col min-h-0">
                <div id="mainSession" class="flex-1 min-h-0 flex flex-col">{% include "list_view.html" %}</div>
            </div>
            {% include "partials/report_sidebar.html" with active="folders" %}
        </div>
    </div>
{% endblock main %}
