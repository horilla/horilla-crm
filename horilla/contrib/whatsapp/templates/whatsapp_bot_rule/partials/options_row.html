{% load i18n %}
<div class="flex items-center gap-2 options-row" data-row-id="{{ row_id }}" id="options-row-{{ row_id }}">
    <input
        type="text"
        name="options_id_{{ row_id }}"
        id="id_options_id_{{ row_id }}"
        value="{{ option_id }}"
        class="w-1/3 text-sm border border-dark-50 rounded-md p-2"
        placeholder="{% trans 'id' %}"
    >
    <input
        type="text"
        name="options_label_{{ row_id }}"
        id="id_options_label_{{ row_id }}"
        value="{{ label }}"
        class="flex-1 text-sm border border-dark-50 rounded-md p-2"
        placeholder="{% trans 'Label' %}"
    >
    <button
        type="button"
        class="options-remove text-red-600 text-xs px-2"
        hx-delete="{% url 'whatsapp:whatsapp_options_remove_row_view' row_id=row_id %}"
        hx-target="#options-row-{{ row_id }}"
        hx-swap="outerHTML"
        hx-indicator="this"
    >&times;</button>
</div>
